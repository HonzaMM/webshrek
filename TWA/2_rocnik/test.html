<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      /* Styl pro odkazy */
      nav a {
        display: inline-block; /* Nutné pro správné fungování transformace */
        transition: transform 0.2s ease; /* Plynulý přechod trvající 0.2 sekundy */
        text-decoration: none; /* Volitelně: odstraní podtržení pro čistší vzhled */
        margin-right: 10px; /* Volitelně: mezera mezi odkazy */
      }

      /* Změna kurzoru a zvětšení při najetí myši */
      nav a:hover {
        cursor: pointer; 
        transform: scale(1.2); /* Zvětší odkaz na 120 % původní velikosti */
      }
    </style>
</head>
<body>
  <header>
    <h1>Název webu</h1>
    <nav>
      <a href="/">Domů</a>
      <a href="/o-nas">O nás</a>
      <a href="tKontakt.html">Kontakt</a>
    </nav>
  </header>

  <main>
    <article>
      <h2>Titulek článku</h2>
      <p>Text článku...</p>
    </article>

    <form name="kalk">
      A: <input type="number" name="a" value="6"> <br>
      B: <input type="number" name="b" value="6"> <br>
      C: <input type="number" name="C" value="6"> <br>
      <button type="button" name="Poslat" onclick="soucet()">vvvy</button>
    </form>

    <p>Výsledek: <strong id="vysledek"></strong></p>

    <aside>
      <p>Postranní panel, reklama, související odkazy.</p>
    </aside>
  </main>

  <footer>
    <p>© 2026 Moje stránka</p>
  </footer>

  <script>
    function soucet() {
      let a = Number(document.kalk.a.value);
      let b = Number(document.kalk.b.value);
      let vysledek = a + b;
      document.getElementById('vysledek').textContent = vysledek;
    }
  </script>
</body>
</html>
